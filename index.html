    <!-- ── Critical Resource Hints ── -->
    <!-- Preconnect to font origins FIRST (eliminates DNS+TLS for fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="dns-prefetch" href="https://api.iconify.design">
    <link rel="dns-prefetch" href="https://unpkg.com">

    <!-- ── Critical Font Load (display=swap prevents FOIT) ── -->

    <!-- ── Inline Critical Script: onboarding gate (must run before paint) ── -->
    <script>
        (function () {
            if (window.location.search.includes('reset') || window.location.hash.includes('reset')) {
                localStorage.removeItem('weekend_explorer_onboarding_completed');
                sessionStorage.removeItem('weekend_explorer_onboarding_completed');
                sessionStorage.removeItem('welcomed');
                sessionStorage.removeItem('we_reviews_popup_shown');
            }
            if (sessionStorage.getItem('weekend_explorer_onboarding_completed') !== 'true') {
                document.documentElement.classList.add('we-onboarding-active');
            }
        })();
    </script>

    <!--
        ── Script Loading Order (all deferred = parsed after HTML, executed in order) ──
        Clerk is async (doesn't block parser, loads independently)
        All own scripts are defer (execute in order after DOM ready)
        Swiper JS is defer (only needed when carousels render)
        Formspree is defer (only needed on form submit)
        Analytics is last-in-body but defer (non-critical)
    -->
    <script async crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_c3RpcnJpbmctc2t5bGFyay05LmNsZXJrLmFjY291bnRzLmRldiQ"
        src="https://stirring-skylark-9.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript"></script>
